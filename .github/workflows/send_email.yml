name: Send Submission Email

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  notify-parents:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history so we can diff with previous commit

      - name: Process submission and post comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            
            try {
              let diffFiles = [];
              const beforeSha = context.payload.before;
              console.log(`Before SHA: ${beforeSha}, After/Current SHA: ${context.sha}`);
              
              try {
                if (beforeSha && beforeSha !== '0000000000000000000000000000000000000000') {
                  diffFiles = execSync(`git -c core.quotepath=false diff --name-only ${beforeSha} ${context.sha}`)
                    .toString()
                    .trim()
                    .split('\n');
                } else {
                  diffFiles = execSync(`git -c core.quotepath=false diff-tree --no-commit-id --name-only -r ${context.sha}`)
                    .toString()
                    .trim()
                    .split('\n');
                }
              } catch (e) {
                console.log("Error running git diff, falling back to single commit diff-tree:", e);
                diffFiles = execSync(`git -c core.quotepath=false diff-tree --no-commit-id --name-only -r ${context.sha}`)
                  .toString()
                  .trim()
                  .split('\n');
              }
              
              // Clean up any double quotes from paths and trim whitespace
              diffFiles = diffFiles.map(f => f.replace(/^"|"$/g, '').trim()).filter(Boolean);
              console.log("Modified files in this push:", diffFiles);
              
              const subFile = diffFiles.find(f => f.startsWith('submissions/') && f.endsWith('.json'));
              if (!subFile) {
                console.log("No submission file was created or modified in this push. Skipping notification.");
                return;
              }
              
              if (!fs.existsSync(subFile)) {
                console.log(`Submission file ${subFile} does not exist locally.`);
                return;
              }
              
              const subData = JSON.parse(fs.readFileSync(subFile, 'utf8'));
              const lessonTitle = subData.lessonTitle || 'Bài học';
              const submittedAt = subData.submittedAt ? new Date(subData.submittedAt).toLocaleString('vi-VN', { timeZone: 'Asia/Ho_Chi_Minh' }) : new Date().toLocaleString('vi-VN', { timeZone: 'Asia/Ho_Chi_Minh' });
              
              let body = `## 🐸 Toán 2 Phiêu Lưu Ký - Bài làm mới của con\n\n`;
              body += `Chào bố mẹ, con đã hoàn thành xong bài học **${lessonTitle}**!\n`;
              body += `* **Thời gian nộp bài:** ${submittedAt}\n`;
              body += `* **Bản ghi trực tuyến:** [\`${subFile}\`](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/${context.sha}/${subFile.replace(/\\/g, '/')})\n\n`;
              body += `### ✏️ Chi tiết câu trả lời của con:\n\n`;
              
              if (subData.answers && subData.answers.length > 0) {
                subData.answers.forEach(item => {
                  const typeLabel = item.type === 'question' ? '❓ Câu hỏi' : '🏃 Bài tập';
                  body += `#### ${typeLabel} ${item.num}: ${item.prompt}\n`;
                  body += `> **Trả lời của con:** <span style="color: #007BFF; font-weight: bold;">${item.answer || '*(Con không trả lời)*'}</span>\n\n`;
                });
              } else {
                body += `*(Không tìm thấy câu trả lời nào)*\n`;
              }
              
              body += `---\n*Lưu ý: Bố mẹ vui lòng xem và tự chấm điểm cho con. Hệ thống không hiện đáp án để khuyến khích con tự tin suy nghĩ.*`;
              
              await github.rest.repos.createCommitComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
                body: body
              });
              
              console.log("Posted commit comment successfully!");
            } catch (err) {
              console.error("Failed to post commit comment:", err);
            }
