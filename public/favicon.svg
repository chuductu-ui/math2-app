<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bg)" stroke="#1B5E20" stroke-width="2"/>
  <!-- Frog face -->
  <ellipse cx="50" cy="55" rx="30" ry="25" fill="#66BB6A"/>
  <!-- Eyes -->
  <circle cx="35" cy="38" r="12" fill="white"/>
  <circle cx="65" cy="38" r="12" fill="white"/>
  <circle cx="35" cy="38" r="7" fill="#1B5E20"/>
  <circle cx="65" cy="38" r="7" fill="#1B5E20"/>
  <circle cx="37" cy="36" r="3" fill="white"/>
  <circle cx="67" cy="36" r="3" fill="white"/>
  <!-- Smile -->
  <path d="M 35 60 Q 50 75 65 60" fill="none" stroke="#1B5E20" stroke-width="3" stroke-linecap="round"/>
  <!-- Blush -->
  <ellipse cx="30" cy="58" rx="6" ry="4" fill="#FF8A80" opacity="0.5"/>
  <ellipse cx="70" cy="58" rx="6" ry="4" fill="#FF8A80" opacity="0.5"/>
  <!-- Math symbol -->
  <text x="50" y="88" text-anchor="middle" font-size="16" font-weight="bold" fill="white" font-family="Arial">+−×</text>
</svg>